# {{ROBOTS}} is filled by scripts/build.py from INDEXING_ALLOWED.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { text/markdown md; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain text/markdown application/json;
    map $http_accept $markdown_suffix { default ""; ~*text/markdown ".md"; }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Robots-Tag "{{ROBOTS}}" always;
        add_header Vary Accept always;
        error_page 404 /404.html;
        location = /healthz { default_type text/plain; return 200 'ok\n'; }
        location = /nginx.conf { return 404; }
        location ~ \.md$ { types { text/markdown md; } }
        location = / { try_files /index$markdown_suffix /index.html =404; }
        location / { try_files $uri$markdown_suffix $uri $uri.html =404; }
    }
}
